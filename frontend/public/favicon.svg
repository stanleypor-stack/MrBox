<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MrBox">
  <!--
    EL ICONO DE LA PESTAÑA.

    La M del logo de MrBox, sacada de la Titan One y convertida a
    contorno: adentro de un favicon no carga ninguna fuente, asi que
    una letra escrita como texto se dibujaria con otra tipografia y
    dejaria de ser el logo.

    Lleva el mismo relieve que el logo grande, con menos capas: a 16 px,
    las nueve del logo son un borron.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b45a8"/>
      <stop offset="1" stop-color="#071634"/>
    </linearGradient>
    <linearGradient id="cara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e3eeff"/>
      <stop offset="1" stop-color="#9fc3f7"/>
    </linearGradient>
    <path id="m" d="M194 0Q169 0 121.5 0.0Q74 0 57.0 7.0Q40 14 40 29V660Q40 683 101.5 696.5Q163 710 233.0 710.0Q303 710 333.0 692.0Q363 674 368 654L436 390H445L509 642Q516 669 574.5 689.5Q633 710 703.0 710.0Q773 710 806.5 699.0Q840 688 840 671V29Q840 16 783.0 8.0Q726 0 644.0 0.0Q562 0 562 29Q562 108 579 310H570L518 49Q515 34 493.5 27.0Q472 20 429.0 20.0Q386 20 376.5 26.0Q367 32 364 49L310 310H301Q319 104 319 29Q319 3 194 0Z"/>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fondo)"/>

  <g transform="translate(10.00 48.75) scale(0.05000 -0.05000) skewX(7)">
      <use href="#m" transform="translate(90 -90)" fill="#06143a" stroke="#06143a" stroke-width="150" stroke-linejoin="round"></use>
      <use href="#m" transform="translate(70 -70)" fill="#0b2266" stroke="#0b2266" stroke-width="120" stroke-linejoin="round"></use>
      <use href="#m" transform="translate(50 -50)" fill="#1a4fc0" stroke="#1a4fc0" stroke-width="110" stroke-linejoin="round"></use>
      <use href="#m" transform="translate(30 -30)" fill="#2a6fe6" stroke="#2a6fe6" stroke-width="100" stroke-linejoin="round"></use>
      <use href="#m" transform="translate(14 -14)" fill="#4a8ff5" stroke="#4a8ff5" stroke-width="95" stroke-linejoin="round"></use>
      <use href="#m" fill="none" stroke="#0b2266" stroke-width="90" stroke-linejoin="round"></use>
      <use href="#m" fill="url(#cara)"></use>
  </g>
</svg>
