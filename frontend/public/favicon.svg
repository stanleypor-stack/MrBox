<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MR BOX">
  <!--
    EL ICONO DE LA PESTAÑA.

    Una caja, que es de lo que se trata el sitio, en el azul de la
    marca. El logo de MR BOX es texto con la Titan One, y una fuente no
    carga en un favicon: a 16 px tampoco se leeria. Una forma simple se
    reconoce chiquita, que es todo lo que tiene que hacer.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8ff5"/>
      <stop offset="1" stop-color="#123a9e"/>
    </linearGradient>
    <linearGradient id="cara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe2ff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fondo)"/>

  <!-- La tapa -->
  <path d="M10 22h44v9H10z" fill="url(#cara)"/>
  <!-- El cuerpo -->
  <path d="M13 31h38v20a3 3 0 0 1-3 3H16a3 3 0 0 1-3-3z" fill="#e3eeff"/>
  <!-- La cinta -->
  <path d="M28 22h8v32h-8z" fill="#ffc83d"/>
  <!-- El moño -->
  <path d="M32 21c-3-6-11-7-11-2 0 3 5 4 11 2zm0 0c3-6 11-7 11-2 0 3-5 4-11 2z" fill="#ffd467"/>
</svg>
