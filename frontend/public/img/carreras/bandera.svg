<!--
  LA BANDERA A CUADROS DE LAS CARRERAS.

  Dibujada y no fotografiada, como la de mrloot: una sola bandera al
  costado del cartel, no una foto de fondo. Asi se puede agrandar sin
  que se pixele, pesa un kilobyte y los cuadros salen en el azul del
  sitio en vez de en el blanco y negro de una foto.

  Las bandas oscuras y claras de adentro son las que le dan el vuelo.
  Sin ellas los cuadros quedan planos y parece un mantel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" fill="none" role="img" aria-label="">
  <defs>
    <pattern id="mb-cuadros" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-4 0 0)">
      <rect width="56" height="56" fill="#f4f8ff"/>
      <rect width="28" height="28" fill="#1d5fd0"/>
      <rect x="28" y="28" width="28" height="28" fill="#1d5fd0"/>
    </pattern>

    <!-- El vuelo: oscuro donde la tela se va para atras, claro donde
         le pega la luz. -->
    <linearGradient id="mb-vuelo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".22"/>
      <stop offset=".14" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".3" stop-color="#000" stop-opacity=".2"/>
      <stop offset=".46" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".62" stop-color="#000" stop-opacity=".18"/>
      <stop offset=".8" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000" stop-opacity=".24"/>
    </linearGradient>

    <clipPath id="mb-tela">
      <path d="M262 46
               C 212 24, 186 92, 132 72
               C 92 57, 64 76, 34 62
               L 34 196
               C 64 210, 92 191, 132 206
               C 186 226, 212 158, 262 180 Z"/>
    </clipPath>
  </defs>

  <g transform="rotate(-5 160 150)">
    <!-- El asta, por detras de la tela. -->
    <rect x="258" y="18" width="13" height="266" rx="6" fill="#16233d"/>
    <rect x="261" y="18" width="4" height="266" rx="2" fill="#2c4470"/>
    <circle cx="264" cy="18" r="9" fill="#2f6fe0"/>
    <circle cx="261" cy="15" r="3" fill="#9cc4ff"/>

    <g clip-path="url(#mb-tela)">
      <rect x="20" y="10" width="260" height="230" fill="url(#mb-cuadros)"/>
      <rect x="20" y="10" width="260" height="230" fill="url(#mb-vuelo)"/>
    </g>

    <!-- El borde, apenas, para que no se funda con el fondo azul. -->
    <path d="M262 46
             C 212 24, 186 92, 132 72
             C 92 57, 64 76, 34 62
             L 34 196
             C 64 210, 92 191, 132 206
             C 186 226, 212 158, 262 180 Z"
          stroke="rgba(255,255,255,.28)" stroke-width="2"/>
  </g>
</svg>
