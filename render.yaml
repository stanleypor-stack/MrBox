# =====================================================================
#  MR BOX en Render — SOLO EL BACKEND.
#
#  El sitio lo sirve Netlify (ver `netlify.toml`); esto es el servidor
#  Express con la base. El codigo ya estaba escrito para Render:
#  `trust proxy` en 1 y los registros a stdout, que es de donde Render
#  los lee.
#
#  COMO SE USA
#
#  En Render: New > Blueprint, y apuntarlo a este repositorio. Lee este
#  archivo y crea el servicio.
#
#  LAS CLAVES NO ESTAN ACA
#
#  Todas las variables de abajo van con `sync: false`: eso le dice a
#  Render que las pida en su panel y que NO las busque en el
#  repositorio. Las escribe Dani una sola vez, en el panel, y no quedan
#  escritas en ningun archivo ni en el historial de git.
# =====================================================================

services:
  - type: web
    name: mrbox-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend

    #  `npm ci` y no `npm install`: instala exactamente lo que dice el
    #  package-lock, sin resolver versiones de nuevo. Un despliegue no
    #  es el momento de estrenar la version nueva de una dependencia.
    buildCommand: npm ci --omit=dev
    startCommand: node index.js

    #  Render pega aca cada tanto para saber si el servicio esta vivo.
    #  Es una ruta publica y barata: no toca la base.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      #  Render le dice al proceso en que puerto escuchar.
      - key: PORT
        value: 10000

      #  CUANTOS PROXIES HAY DE VERDAD ENTRE EL NAVEGADOR Y ESTO.
      #
      #  Uno: el borde de Render. Decia 2 porque se escribio pensando
      #  en Netlify adelante reenviando `/api`, y Netlify nunca entro:
      #  el navegador le habla derecho a este servicio.
      #
      #  Y poner uno DE MAS no es un detalle. Express confia en los
      #  ultimos N renglones de `X-Forwarded-For` y toma el de al lado
      #  como el visitante. Con 2 y un solo proxy, ese renglon lo
      #  escribe el que pide: elige la IP que quiere. Probado --con 2,
      #  el servidor le cree la IP inventada; con 1, la ignora-- y eso
      #  deja sin efecto TODOS los frenos por IP, el de intentos de
      #  login incluido: una IP nueva por intento y nunca frena nada.
      #
      #  Si manana entra Cloudflare delante de ESTE servicio --con el
      #  naranja prendido, no solo el DNS-- pasa a 2.
      - key: PROXIES_DELANTE
        value: 1

      #  ── Las que escribe Dani en el panel ──────────────────────────
      #
      #  La direccion del sitio en Netlify, para el CORS. Sin ella el
      #  servidor NO arranca en produccion, a proposito: olvidarla
      #  dejaria la API abierta a cualquier pagina.
      - key: SITIO_URL
        sync: false

      #  La cadena de conexion de MongoDB Atlas, con usuario y clave.
      - key: DATABASE_URI
        sync: false

      #  Con que se firman las sesiones. Un texto largo y al azar.
      #  Si cambia, se cierran todas las sesiones abiertas.
      - key: JWT_SECRET
        sync: false

      #  ── Las que se pueden dejar vacias para una prueba ────────────
      #
      #  Sin el secret de Turnstile el captcha no valida y no se puede
      #  entrar ni registrarse. Para una prueba hace falta igual.
      - key: TURNSTILE_SECRET_KEY
        sync: false

      #  Sin estas no andan los depositos ni los canjes, que para una
      #  prueba esta bien: es plata de verdad.
      - key: OXAPAY_MERCHANT_KEY
        sync: false
      - key: OXAPAY_PAYOUT_KEY
        sync: false
      - key: OXAPAY_CALLBACK_SECRET
        sync: false
      - key: OXAPAY_CALLBACK_URL
        sync: false

      #  Sin esto el boton de "Entrar con Google" no funciona; el resto
      #  del sitio si.
      - key: GOOGLE_CLIENT_ID
        sync: false

      #  El borrador de soporte con IA. Vacia = el panel no muestra el
      #  boton, que es lo que Dani eligio por ahora.
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── El sitio ─────────────────────────────────────────────────────
  #
  #  Estatico: lo que deja `npm run build` en `frontend/dist`. Render lo
  #  sirve gratis y sin limite de horas, porque no hay nada corriendo.
  #
  #  POR QUE APUNTA AL BACKEND POR SU DIRECCION
  #
  #  Un sitio estatico de Render no puede reenviar `/api` a otro
  #  servicio: sus reglas de ruta solo mueven cosas adentro del mismo
  #  sitio. Asi que el navegador habla directo con `mrbox-api`, y por
  #  eso hace falta que el backend lo permita: su `SITIO_URL` tiene que
  #  ser la direccion de aca.
  #
  #  Con Netlify adelante esto no haria falta --Netlify si sabe
  #  reenviar-- y por eso `netlify.toml` existe igual: mudarse es
  #  cambiar esa variable por vacia.
  - type: web
    name: mrbox-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: VUE_APP_API_URL
        value: https://mrbox-api.onrender.com/api

      #  El SITE KEY del captcha es publico a proposito: viaja en el
      #  HTML. El secreto va en el backend.
      - key: VUE_APP_TURNSTILE_SITE_KEY
        sync: false

      #  El CLIENT ID de Google, tambien publico: el boton de "Entrar
      #  con Google" lo manda en el pedido y Google lo ve igual.
      #
      #  Hacen falta LOS DOS, aca y en el backend, y son el mismo
      #  valor: sin este el boton ni se dibuja, y sin el del backend
      #  la ruta contesta que no existe. Faltaba este.
      - key: VUE_APP_GOOGLE_CLIENT_ID
        sync: false

    routes:
      #  El sitio es una sola pagina con rutas del lado del navegador.
      #  Sin esto, entrar derecho a `/boxes/mac` da 404: ese archivo no
      #  existe en el disco.
      - type: rewrite
        source: /*
        destination: /index.html
